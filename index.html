<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="img/logbro.jpeg">
<link rel="apple-touch-icon" href="img/logbro.jpeg">
<title>Karaoke Bus - Pilih Unit</title>
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<!-- NAVBAR WITH LOGO -->
<nav class="top-navbar">
<img src="img/hioo.jpeg" alt="HiQo Logo" class="navbar-logo">
</nav>

<!-- HERO HEADER WITH BACKGROUND (NO OVERLAY) -->
<header class="hero-header">
<div class="hero-content">
<h1 class="hero-title">Pusat Kontrol Hiburan Karaoke Bus<br>Bikin Perjalanan Makin Meriah!</h1>
<p class="hero-subtitle">Pilih unit dibawah untuk memulai Karaoke,<br>atur playlist atau mereset sistem.</p>
</div>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">
<div class="container">
<!-- SECTION HEADER -->
<div class="section-header">
<h2 class="section-title">Pilih Unit Yang Sedang Digunakan</h2>
<div class="custom-room-input">
<input type="text" id="custom-room-id" placeholder="MASUKKAN ROOM ID" style="text-transform: uppercase;">
<button onclick="enterCustomRoom()" class="btn-masuk">Masuk</button>
</div>
</div>

<!-- BUS GRID -->
<div class="bus-grid" id="bus-grid">
<!-- Bus cards akan di-generate oleh JavaScript -->
</div>
</div>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/index.js"></script>
</body>
</html>
