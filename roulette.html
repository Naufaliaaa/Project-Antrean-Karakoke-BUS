<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="img/logbro.jpeg?v=2">
    <link rel="apple-touch-icon" href="img/logbro.jpeg?v=2">
    <title>Roulette Arisan - Karaoke Bus</title>
    <link rel="stylesheet" href="css/roulette.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="top-navbar">
        <img src="img/hioo.jpeg" alt="Hioo Logo" class="navbar-logo">
    </nav>

    <!-- HEADER SECTION -->
    <header class="page-header">
        <div class="back-button" id="back-button">
            <span class="back-icon">←</span>
            <span>Kembali</span>
        </div>
    </header>

    <!-- ========================================
         SECTION 1: RODA FULLSCREEN CENTER
    ======================================== -->
    <section class="wheel-fullscreen">
        <div class="wheel-area">
            <div class="wheel-wrapper">
                <!-- Triangle Pointer -->
                <div class="wheel-pointer"></div>
                
                <!-- SVG Wheel -->
                <svg id="wheel-svg" class="wheel-svg" viewBox="0 0 500 500">
                    <g id="wheel-slices"></g>
                    <circle cx="250" cy="250" r="50" fill="white" stroke="#ddd" stroke-width="3"/>
                </svg>
            </div>
            
            <!-- Spin Button -->
            <button class="spin-button" id="spin-button" disabled>
                <span class="spin-icon">▶</span>
                <span>PUTAR</span>
            </button>

            <!-- Winner Display -->
            <div class="winner-announcement" id="winner-announcement" style="display: none;">
                <div class="winner-confetti">🎉</div>
                <div class="winner-text" id="winner-text">Pemenang</div>
                <div class="winner-confetti">🎊</div>
            </div>
        </div>
    </section>

    <!-- ========================================
         SECTION 2: PANEL BAWAH (QR + Entries)
    ======================================== -->
    <section class="bottom-panel">
        <div class="bottom-panel-grid">

            <!-- KOLOM KIRI: QR CODE -->
            <div class="panel-card qr-panel">
                <div class="panel-card-title">📱 Scan untuk Daftar</div>
                <div class="qr-code-wrapper">
                    <img id="roulette-qr-image" alt="QR Code" class="roulette-qr-code">
                </div>
                <p class="qr-url-text" id="roulette-form-url">Loading...</p>
                <div class="online-entries-count" id="online-entries-count">
                    0 peserta online terdaftar
                </div>
            </div>

            <!-- KOLOM TENGAH: DAFTAR PESERTA -->
            <div class="panel-card entries-panel">
                <div class="entries-header">
                    <h2 class="entries-title">Daftar Peserta</h2>
                    <div class="entries-count" id="entries-count">0 peserta</div>
                </div>

                <!-- Tab Switch - Online / Manual -->
                <div class="entries-tabs">
                    <button class="tab-btn active" id="tab-online" data-tab="online">📱 Online</button>
                    <button class="tab-btn" id="tab-manual" data-tab="manual">✏️ Manual</button>
                </div>

                <!-- TAB: Online Entries -->
                <div class="tab-content active" id="tab-content-online">
                    <div class="online-entries-list" id="online-entries-list">
                        <div class="empty-online">Belum ada peserta online. Bagikan QR Code!</div>
                    </div>
                </div>

                <!-- TAB: Manual Entries -->
                <div class="tab-content" id="tab-content-manual">
                    <div class="entries-input-wrapper">
                        <textarea 
                            id="entries-textarea" 
                            class="entries-textarea"
                            placeholder="Masukkan nama peserta (satu per baris)&#10;&#10;Contoh:&#10;Fabio&#10;Eric&#10;Charles"
                            rows="8"
                        ></textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="entries-actions">
                    <button class="action-button" id="apply-button">
                        <span>✓</span> Terapkan
                    </button>
                    <button class="action-button secondary" id="clear-button">
                        <span><img src="img/reset.png" alt="reset" style="width:16px;height:16px;vertical-align:middle;"></span> Reset Semua
                    </button>
                </div>

                <!-- Options -->
                <div class="options-section">
                    <label class="option-checkbox">
                        <input type="checkbox" id="remove-winner-checkbox" checked>
                        <span>Hapus pemenang dari roda</span>
                    </label>
                </div>
            </div>

            <!-- KOLOM KANAN: PEMENANG -->
            <div class="panel-card winners-panel">
                <div class="winners-section" id="winners-section">
                    <h3 class="winners-title">🏆 Urutan Pemenang</h3>
                    <div class="winners-list" id="winners-list">
                        <div class="empty-winners">Belum ada pemenang</div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Custom Modal -->
    <script src="js/custom-modal.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/room.js"></script>
    <script src="js/roulette.js"></script>
</body>
</html>
