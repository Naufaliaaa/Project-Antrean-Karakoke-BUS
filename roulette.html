<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="img/logbro.jpeg?v=2">
    <link rel="apple-touch-icon" href="img/logbro.jpeg?v=2">
    <title>Roulette Arisan - Karaoke Bus</title>
    <link rel="stylesheet" href="css/roulette.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="top-navbar">
        <img src="img/hioo.jpeg" alt="Hioo Logo" class="navbar-logo">
    </nav>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <div class="hero-content">
            <div class="back-button" id="back-button">
                <span class="back-icon">←</span>
                <span>Kembali ke Menu</span>
            </div>
            <h1 class="hero-title">Roulette Arisan</h1>
            <p class="hero-subtitle">Pilih pemenang secara acak dengan memutar roda</p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="wheel-container-wrapper">
            <!-- LEFT SIDE: WHEEL -->
            <div class="wheel-section">
                <div class="wheel-wrapper">
                    <!-- Triangle Pointer -->
                    <div class="wheel-pointer"></div>
                    
                    <!-- SVG Wheel -->
                    <svg id="wheel-svg" class="wheel-svg" viewBox="0 0 500 500">
                        <g id="wheel-slices"></g>
                        <circle cx="250" cy="250" r="50" fill="white" stroke="#ddd" stroke-width="3"/>
                        <text x="250" y="265" text-anchor="middle" font-size="30" fill="#666">🎯</text>
                    </svg>
                </div>
                
                <!-- Spin Button -->
                <button class="spin-button" id="spin-button" disabled>
                    <span class="spin-icon">▶</span>
                    <span>PUTAR</span>
                </button>

                <!-- Winner Display -->
                <div class="winner-announcement" id="winner-announcement" style="display: none;">
                    <div class="winner-confetti">🎉</div>
                    <div class="winner-text" id="winner-text">Pemenang</div>
                    <div class="winner-confetti">🎊</div>
                </div>
            </div>

            <!-- RIGHT SIDE: ENTRIES -->
            <div class="entries-section">
                <div class="entries-header">
                    <h2 class="entries-title">Daftar Peserta</h2>
                    <div class="entries-count" id="entries-count">0 peserta</div>
                </div>

                <div class="entries-input-wrapper">
                    <textarea 
                        id="entries-textarea" 
                        class="entries-textarea"
                        placeholder="Masukkan nama peserta (satu per baris)&#10;&#10;Contoh:&#10;Fabio&#10;Eric&#10;Charles&#10;Gabriel&#10;Diya&#10;Beatriz&#10;Ali"
                        rows="15"
                    ></textarea>
                </div>

                <div class="entries-actions">
                    <button class="action-button" id="apply-button">
                        <span>✓</span> Terapkan
                    </button>
                    <button class="action-button secondary" id="clear-button">
                        <span>×</span> Hapus Semua
                    </button>
                </div>

                <!-- Winners List -->
                <div class="winners-section" id="winners-section" style="display: none;">
                    <h3 class="winners-title">🏆 Urutan Pemenang</h3>
                    <div class="winners-list" id="winners-list"></div>
                </div>

                <!-- Options -->
                <div class="options-section">
                    <label class="option-checkbox">
                        <input type="checkbox" id="remove-winner-checkbox" checked>
                        <span>Hapus pemenang dari roda</span>
                    </label>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Modal -->
    <script src="js/custom-modal.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/room.js"></script>
    <script src="js/roulette.js"></script>
</body>
</html>
