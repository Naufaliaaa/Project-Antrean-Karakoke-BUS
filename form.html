<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon (dengan version parameter untuk bypass cache) -->
<link rel="icon" type="image/jpeg" href="img/logbro.jpeg?v=2">
<link rel="apple-touch-icon" href="img/logbro.jpeg?v=2">
<title>Request Lagu - Hioo Karaoke</title>
<link rel="stylesheet" href="css/form.css">
</head>
<body>

<!-- ========================================
     CONTAINER
======================================== -->
<div class="container">
  
  <!-- ========================================
       LOGO SECTION
  ======================================== -->
  <div class="logo-section">
<img src="img/hioo.jpeg" alt="Hioo Logo" class="logo-image">
    <p class="logo-tagline">Silahkan Request lagu yang anda ingin kan</p>
  </div>

  <!-- ========================================
       TITLE SECTION
  ======================================== -->
  <div class="title-section">
    <h1 class="main-title">Request Lagu</h1>
    <p class="main-subtitle">Masukan Nama dan Link Youtube Lagu Kamu!</p>
  </div>

  <!-- ========================================
       ALERT (Hidden by default)
  ======================================== -->
  <div id="alert" class="alert"></div>

  <!-- ========================================
       FORM SECTION
  ======================================== -->
  <div class="form-section">
    
    <!-- Nama Kamu -->
    <div class="form-group">
      <label for="name" class="form-label">Nama Kamu</label>
      <input 
        type="text" 
        id="name" 
        class="form-input"
        placeholder="Masukan nama......."
        autocomplete="name"
      >
    </div>

    <!-- Link YouTube -->
    <div class="form-group">
      <label for="youtube-link" class="form-label">Link YouTube</label>
      <input 
        type="url" 
        id="youtube-link" 
        class="form-input"
        placeholder="https://youtube.com....."
        autocomplete="url"
      >
    </div>

    <!-- Edit Mode Badge (muncul saat mode edit aktif) -->
    <div class="edit-mode-badge" id="edit-mode-badge">
      <span class="badge-icon">✏️</span>
      <div class="badge-text">Mode Edit Aktif — ubah nama atau link lagu kamu, lalu klik Simpan.</div>
    </div>

    <!-- Submit Button -->
    <button class="submit-button" onclick="submitSong()">
      <span class="button-icon">➕</span>
      <span class="button-text">Tambah Antrean</span>
    </button>

    <!-- Tombol Edit Request (muncul jika posisi >= 3) -->
    <button class="edit-request-btn" id="edit-request-btn">
      <span>✏️</span> Edit Request
    </button>

    <!-- Tombol Batal Edit (muncul saat mode edit) -->
    <button class="cancel-edit-btn" id="cancel-edit-btn">
      <span>✕</span> Batal Edit
    </button>

  </div>

  <!-- ========================================
       LIVE REACTION (EMOTES)
  ======================================== -->
  <div class="live-reaction-section">
    <h2 class="reaction-title">LIVE REACTION</h2>
    
    <div class="emote-grid">
      <!-- Row 1 -->
      <button class="emote-btn" onclick="sendEmote('👏', 'Tepuk Tangan')" title="Tepuk Tangan">
        👏
      </button>
      <button class="emote-btn" onclick="sendEmote('❤️', 'Love')" title="Love">
        ❤️
      </button>
      <button class="emote-btn" onclick="sendEmote('👍', 'Jempol')" title="Jempol">
        👍
      </button>
      <button class="emote-btn" onclick="sendEmote('🔥', 'Mantap')" title="Mantap">
        🔥
      </button>

      <!-- Row 2 -->
      <button class="emote-btn" onclick="sendEmote('🥰', 'Senyum Love')" title="Senyum Love">
        🥰
      </button>
      <button class="emote-btn" onclick="sendEmote('😎', 'Keren')" title="Keren">
        😎
      </button>
      <button class="emote-btn" onclick="sendEmote('😂', 'Ketawa')" title="Ketawa">
        😂
      </button>
      <button class="emote-btn" onclick="sendEmote('🥳', 'Party')" title="Party">
        🥳
      </button>
    </div>
  </div>

  <!-- ========================================
       EDIT REQUEST
  ======================================== -->
  <div class="edit-request-section" id="edit-request-section" style="display:none;">
    <div class="edit-request-status" id="edit-request-status">—</div>
    <h2 class="reaction-title">EDIT REQUEST</h2>

    <div class="edit-request-hint" id="edit-request-hint">
      Anda sedang antre. Silakan ubah nama & link YouTube.
    </div>

    <div class="edit-controls">
      <button class="edit-button" type="button" id="edit-toggle-button" onclick="toggleEditMode()">
        ✏️ Edit
      </button>

      <button class="edit-button primary" type="button" id="edit-save-button" onclick="saveEditedRequest()" style="display:none;">
        ✅ Simpan Perubahan
      </button>

      <button class="edit-button" type="button" id="edit-cancel-button" onclick="cancelEditMode()" style="display:none;">
        ↩️ Batal
      </button>
    </div>
  </div>

  <!-- ========================================
       QUEUE STATUS
  ======================================== -->
  <div class="queue-info">
    <div class="queue-total">
      Total Antrean : <strong><span id="queue-count">0/25</span></strong>
    </div>
    
    <div class="queue-status" id="queue-status">
      ⏳ Menunggu antrean...
    </div>
  </div>

</div>

<!-- ========================================
     SCRIPTS
======================================== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/room.js"></script>
<script src="js/form.js"></script>

</body>
</html>
