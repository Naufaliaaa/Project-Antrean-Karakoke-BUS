<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon (dengan version parameter untuk bypass cache) -->
<link rel="icon" type="image/jpeg" href="img/logbro.jpeg?v=2">
<link rel="apple-touch-icon" href="img/logbro.jpeg?v=2">
<title>Video Panel - Hioo Karaoke</title>
<link rel="stylesheet" href="css/video-panel.css">
</head>
<body>

<!-- ========================================
     CONTAINER
======================================== -->
<div class="container">
  
  <!-- ========================================
       HEADER - LOGO + LOGOUT
  ======================================== -->
  <div class="header">
    <!-- Logo Section -->
    <div class="logo-section">
<img src="img/hioo.jpeg" alt="Hioo Logo" class="logo-image">
      <p class="logo-tagline">JALAN JALAN NYAMAN, CUAN AMAN</p>
    </div>
    
    <!-- Logout Button (Top Right) -->
<button id="logout-btn" class="logout-button">
<img src="img/log-out.png" alt="Logout" style="width: 20px; height: 20px;">
<span class="logout-text">Keluar</span>
</button>
  </div>

  <!-- ========================================
       TITLE
  ======================================== -->
  <div class="title-section">
    <h1 class="main-title">VIDEO PANEL</h1>
  </div>

  <!-- ========================================
       CAMERA PREVIEW
  ======================================== -->
  <div class="camera-preview" id="camera-preview">
    <video id="local-video" autoplay playsinline muted></video>
    
    <!-- Camera Overlay (Shown when camera is off) -->
    <div class="camera-overlay" id="camera-overlay">
      <div class="overlay-message">
        <div class="camera-icon">📷</div>
        <p class="overlay-text">Kamera Belum Aktif</p>
        <button class="btn-primary" id="start-camera-btn">Aktifkan Kamera</button>
      </div>
    </div>
  </div>

  <!-- ========================================
       STATUS BAR
  ======================================== -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">Status :</span>
      <span class="status-dot" id="status-dot"></span>
      <span class="status-value" id="connection-status">Offline</span>
    </div>
    <div class="status-item">
      <span class="status-label">Streaming :</span>
      <span class="status-value" id="streaming-status">Tidak Aktif</span>
    </div>
  </div>

  <!-- ========================================
       CONTROL BUTTONS
  ======================================== -->
  <div class="control-buttons">
    
    <!-- Mulai Rekam / Stop Rekam -->
    <button class="control-btn record-btn" id="record-btn" title="Mulai Rekam" disabled>
      <span class="btn-icon" id="record-icon">
        <img src="img/video-record.png" alt="Record" style="width: 24px; height: 24px;">
      </span>
      <span class="btn-text" id="record-text">Mulai Rekam</span>
    </button>

    <!-- Stop Camera (Hidden by default) -->
    <button class="control-btn danger-btn" id="stop-camera-btn" title="Stop Kamera" style="display: none;">
      <span class="btn-icon">
        <img src="img/no-camera.png" alt="stop-camera" style="width: 24px; height: 24px;">
      </span>
      <span class="btn-text">Stop Camera</span>
    </button>

    <!-- Balik Kamera -->
    <button class="control-btn secondary-btn" id="flip-camera-btn" title="Balik Kamera" disabled>
      <span class="btn-icon">
        <img src="img/camera.png" alt="Flip Camera" style="width: 24px; height: 24px;">
      </span>
      <span class="btn-text">Balik Kamera</span>
    </button>

    <!-- NEW: Matikan Mic/Video -->
    <button class="control-btn mute-btn" id="mute-btn" title="Matikan Mic/Video" disabled>
      <span class="btn-icon">
        <img id="mute-icon" src="img/mute.png" alt="Mic" style="width: 24px; height: 24px;">
      </span>
      <span class="btn-text" id="mute-text">Matikan Mic Video</span>
    </button>

  </div>

</div>

<!-- ========================================
     SCRIPTS
======================================== -->

<!-- 1. Custom Modal -->
<script src="js/custom-modal.js"></script>

<!-- 2. Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- 3. Firebase Config -->
<script src="js/firebase.js"></script>

<!-- 4. Room Manager -->
<script src="js/room.js"></script>

<!-- 5. Security Check -->
<script src="js/video-panel-page.js"></script>

<!-- 6. Main Logic -->
<script src="js/video-panel.js"></script>

<!-- 7. Event Handlers -->
<script>
console.log('🔧 Setting up event handlers...');

// Wait for DOM
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setupEventHandlers);
} else {
  setupEventHandlers();
}

function setupEventHandlers() {
  console.log('📍 Setting up all button handlers...');
  
  // ========= START CAMERA BUTTON =========
  const startBtn = document.getElementById('start-camera-btn');
  if (startBtn) {
    startBtn.addEventListener('click', function() {
      console.log('🎬 START CAMERA BUTTON CLICKED!');
      
      if (typeof window.startCamera === 'function') {
        console.log('✅ Calling window.startCamera()');
        window.startCamera();
      } else {
        console.error('❌ window.startCamera not found!');
        alert('⚠️ Fungsi kamera belum siap.\n\nSolusi:\n1. Refresh halaman (F5)\n2. Tunggu beberapa detik\n3. Coba lagi');
      }
    });
    console.log('✅ Start camera button handler attached');
  }
  
  // ========= STOP CAMERA BUTTON =========
  const stopBtn = document.getElementById('stop-camera-btn');
  if (stopBtn) {
    stopBtn.addEventListener('click', function() {
      console.log('⏹️ STOP CAMERA BUTTON CLICKED!');
      if (typeof window.stopCamera === 'function') {
        window.stopCamera();
      }
    });
    console.log('✅ Stop camera button handler attached');
  }
  
  // ========= FLIP CAMERA BUTTON =========
  const flipBtn = document.getElementById('flip-camera-btn');
  if (flipBtn) {
    flipBtn.addEventListener('click', function() {
      console.log('🔄 FLIP CAMERA BUTTON CLICKED!');
      if (typeof window.flipCamera === 'function') {
        window.flipCamera();
      }
    });
    console.log('✅ Flip camera button handler attached');
  }
  
  // ========= RECORD BUTTON =========
  const recordBtn = document.getElementById('record-btn');
  if (recordBtn) {
    recordBtn.addEventListener('click', function() {
      console.log('⏺️ RECORD BUTTON CLICKED!');
      if (typeof window.toggleRecording === 'function') {
        window.toggleRecording();
      }
    });
    console.log('✅ Record button handler attached');
  }
  
  // ========= NEW: MUTE BUTTON =========
  const muteBtn = document.getElementById('mute-btn');
  if (muteBtn) {
    muteBtn.addEventListener('click', function() {
      console.log('🎤 MUTE BUTTON CLICKED!');
      if (typeof window.toggleMute === 'function') {
        window.toggleMute();
      }
    });
    console.log('✅ Mute button handler attached');
  }
  
  // ========= LOGOUT BUTTON =========
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function(e) {
      e.preventDefault();
      console.log('🚪 LOGOUT BUTTON CLICKED!');
      if (typeof window.logout === 'function') {
        window.logout();
      }
    });
    console.log('✅ Logout button handler attached');
  }
  
  console.log('✅✅✅ All event handlers ready!');
}
</script>

</body>
</html>
