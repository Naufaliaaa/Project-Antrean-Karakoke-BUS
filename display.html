<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="img/logbro.jpeg">
<link rel="apple-touch-icon" href="img/logbro.jpeg">
<title>Display - Layar Karaoke Bus</title>
<link rel="stylesheet" href="css/display.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-left">
<img src="img/hioo.jpeg" alt="Hioo Logo" class="navbar-logo">
  </div>
  <div class="navbar-center">
    <div class="navbar-title">Ingat Holiday Ingat Hioo</div>
    <div class="navbar-subtitle">Jalan Jalan NYAMAN Cuan AMAN</div>
  </div>
  <div class="navbar-right">
    <button id="logout-btn" class="display-logout-btn">
      <img src="img/log-out.png" alt="Logout" class="logout-icon">
      <span>Logout</span>
    </button>
  </div>
</nav>

<!-- YouTube Player Container -->
<div id="player-container">
<div id="player"></div>

<!-- ✨ EMOTE CONTAINER (PENTING!) -->
<div id="emote-container" class="emote-container"></div>

<!-- PiP Camera (Pojok Kanan Bawah) -->
<div id="pip-camera" class="pip-camera hidden">
<video id="pip-video" autoplay playsinline></video>
<div class="pip-label">
<span class="pip-dot"></span>
<span>LIVE</span>
</div>
</div>
</div>

<div class="now-playing">
<div class="now-playing-label">Sedang Bernyanyi</div>
<div class="now-playing-name" id="now">Menunggu lagu...</div>
<div class="now-playing-time" id="timer"><img src="img/waktu.png" alt="Waktu" class="timer-icon"> 10:00</div>
</div>

<div class="queue-container">
<div class="queue-header"><img src="img/antre.png" alt="Antre" class="queue-icon"> Antrean Selanjutnya</div>
<div id="queue-list" class="empty">Belum ada antrean</div>
<div class="queue-footer">© Team IT Hioo 2025</div>
</div>

<!-- Custom Modal -->
<script src="js/custom-modal.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/room.js"></script>
<script src="js/display-page.js"></script>
<script src="js/display.js"></script>
</body>
</html>
